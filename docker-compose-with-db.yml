services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: games_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      # Set MONGODB_URL in a local .env file (gitignored), e.g.:
      #   MONGODB_URL=mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/
      # or point at the local mongodb service: mongodb://<user>:<pass>@mongodb:27017/
      MONGODB_URL: "${MONGODB_URL}"
    depends_on:
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: games_frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Optional: MongoDB service if you want to run MongoDB locally
  mongodb:
    image: mongo:6.0
    container_name: games_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD}"
    volumes:
      - mongodb_data:/data/db

# Volumes for MongoDB data
volumes:
  mongodb_data:
    driver: local
